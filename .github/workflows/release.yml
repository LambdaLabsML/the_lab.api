name: Release (tagged)

# Stable channel. A version tag produces a normal GitHub Release whose wheel
# contains the compiled dashboard, so installing needs no Node.js:
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# The rolling counterpart for the main branch is main.yml.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: write # create the release, upload assets

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Derive tag and PEP 440 version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          # v0.1.1 -> 0.1.1 ; also accepts 0.1.1rc1 / 0.1.1b2
          if [[ "$tag" =~ ^v?([0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::tag '$tag' is not a version tag (expected e.g. v0.1.1)"
            exit 1
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
          body: |
            Install with the compiled dashboard included (no Node.js needed):

            ```bash
            pipx install --force "https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/${{ needs.build.outputs.wheel }}"
            ```

            Already installed? Top up just the dashboard:

            ```bash
            the-lab fetch-dashboard
            ```

            For the latest unreleased code, see the
            [`main`](https://github.com/${{ github.repository }}/releases/tag/main)
            rolling build.
